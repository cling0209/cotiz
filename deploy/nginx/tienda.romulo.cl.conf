# carro — tienda online
# Proxy: 127.0.0.1:8000
# Copiar a /etc/nginx/sites-available/ en el VPS (omitir si ya existe)

server {
    listen 80;
    listen [::]:80;
    server_name tienda.romulo.cl;

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/laravel-proxy.conf;
    }
}
