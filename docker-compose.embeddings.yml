# Servicio compartido en el VPS (un solo contenedor para Reicol + Rómulo).
# Uso en Hetzner:
#   cd /opt/cotiz-reicol && docker compose -f docker-compose.embeddings.yml up -d --build
# Apps: COTIZ_EMBEDDING_URL=http://host.docker.internal:8091

services:
  embeddings:
    build:
      context: ./docker/embeddings
      dockerfile: Dockerfile
    image: cotiz-embeddings:local
    restart: unless-stopped
    # Escucha en todas las interfaces para que los contenedores app (host-gateway) puedan conectar.
    # En el VPS, no exponer 8091 en el firewall público.
    ports:
      - "8091:8080"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_WARMUP: ${EMBEDDING_WARMUP:-true}
