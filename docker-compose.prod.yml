# Producción Hetzner: Postgres + app (Dockerfile raíz)
# Uso: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# APP_PORT / POSTGRES_PORT en .env.prod (Romulo: 8001/5433, Reicol: 8002/5434)

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      COTIZ_PADDLEOCR_URL: http://paddleocr:8080
      COTIZ_LIBREOFFICE_URL: http://libreoffice:8080
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      paddleocr:
        condition: service_started
      libreoffice:
        condition: service_started

  libreoffice:
    image: cotiz-libreoffice:local
    build:
      context: ./docker/libreoffice
      dockerfile: Dockerfile
    restart: unless-stopped
    # Sin puerto en el host: la app usa http://libreoffice:8080 en la red interna.
    # Misma imagen para Rómulo y Reicol (un solo build en el VPS).

  paddleocr:
    build:
      context: ./docker/paddleocr
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # CX33 (8 GB): PP-Structure para tablas escaneadas. Reicol puede forzar tesseract si falta RAM.
      PADDLEOCR_DPI: ${PADDLEOCR_DPI:-150}
      PADDLEOCR_MAX_PAGES: ${PADDLEOCR_MAX_PAGES:-15}
      PADDLEOCR_WARMUP: ${PADDLEOCR_WARMUP:-true}
      PADDLEOCR_MODE: ${PADDLEOCR_MODE:-structure}
      PADDLEOCR_CROP_LEFT_PERCENT: ${PADDLEOCR_CROP_LEFT_PERCENT:-58}
      PADDLEOCR_MAX_IMAGE_WIDTH: ${PADDLEOCR_MAX_IMAGE_WIDTH:-1400}
    # Sin puerto en el host: la app usa http://paddleocr:8080 en la red interna.
    # Evita conflicto 8010 cuando Romulo y Reicol comparten el mismo VPS.

volumes:
  postgres_data:
